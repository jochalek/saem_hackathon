[project]
name = "saem-disposition-autoresearch"
version = "0.1.0"
description = "Autoresearch scaffold for SAEM disposition classification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1.3",
  "pandas>=2.2.3",
  "openpyxl>=3.1.5",
  "scikit-learn>=1.5.2",
  "torch",
  "torchvision",
  "torchaudio",
  "cudf-cu12",
  "cuml-cu12",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
